[package]
name = "file-tag"
publish = false
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Arajtav/file-tag"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.5.48", features = ["derive"] }
directories = "6.0.0"
inquire = "0.9.1"
itertools = "0.15.0"
rusqlite = "0.41.0"
rusqlite_migration = "2.7.0"
thiserror = "2.0.17"

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"] }

[dev-dependencies]
assert_fs = "1.1.3"
