[package]
name = "file-tag"
publish = false
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Arajtav/file-tag"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
directories = "6.0.0"
inquire = "0.9.1"
rusqlite = "0.37.0"
thiserror = "2.0.17"

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
